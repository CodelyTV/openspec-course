services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U retail -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retail-postgres-data:/var/lib/postgresql/data

volumes:
  retail-postgres-data:
